{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h1 class="h3 mb-1">Log in</h1>
  <p class="text-muted">Students: use your registration number as username.</p>
  <form method="post" class="card card-body">{% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
    <div class="mb-3"><label class="form-label" for="id_username">Username</label>
      <input type="text" name="username" id="id_username" class="form-control" autofocus required></div>
    <div class="mb-3"><label class="form-label" for="id_password">Password</label>
      <input type="password" name="password" id="id_password" class="form-control" required></div>
    <button class="btn btn-scms">Log in</button>
  </form>
  <p class="mt-3 small"><a href="{% url 'register' %}">Create a student account</a> &middot; <a href="{% url 'password_reset' %}">Forgot password?</a></p>
</div></div>
{% endblock %}
